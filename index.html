<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARBEID STRIJDERS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <div id="startScreen">
        <h1>ARBEID STRIJDERS</h1>
        <p>Press Any Key to Start</p>
        <div id="startScreenStats">
            <p id="lastGameLabel">Last Game</p>
            <p id="startScoreText">Score: 0</p>
            <p id="startComboText">Highest Combo: x0</p>
        </div>
    </div>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="Screenidle.mp4" type="video/mp4">
    </video>
    <div id="hud">
        <div id="scoreText">Score: 0</div>
        <div id="comboText">Combo: 0</div>
        <div id="healthContainer"></div>
        <p id="Preformace"></p>
    </div>
    
    <div id="time">
        <img id="Richepicdudebro99" src="./img/richmfer.webp">
    </div>
</body>
</html>
